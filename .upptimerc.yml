# N52 TV durum sayfası (status.n52tv.com). Denetimler GitHub Actions'ta 5 dakikada bir çalışır;
# sayfa GitHub Pages'te durur, N52 TV sunucusu çökse de açık kalır.
owner: Dizginfra
repo: status

sites:
  - name: Haber sitesi
    url: https://n52tv.com/
    expectedStatusCodes:
      - 200
  - name: Yönetim paneli
    url: https://panel.n52tv.com/
    expectedStatusCodes:
      - 200
  - name: Sunucu ve veritabanı
    # Hazır olma denetimi: API'nin veritabanına ulaştığını da doğrular.
    url: https://panel.n52tv.com/api/ready
    expectedStatusCodes:
      - 200
  - name: Okur API'si
    url: https://n52tv.com/api/public/v1/site
    expectedStatusCodes:
      - 200

